<!DOCTYPE html>
<html>
<head>
  <title>Countdown Timer</title>
  <style>
    #countdown {
      text-align: center;
    }

    #content img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="countdown">
    <h1>Waktu Mundur</h1>
    <p id="timer"></p>
  </div>
  
  <div id="content" style="display: none; text-align: center;">
    <img src="gambar.jpg" alt="Gambar" class="responsive-image">
    <h2>Tulisan yang akan ditampilkan saat waktu tercapai.</h2>
  </div>

  <script>
    // Tentukan waktu target untuk countdown (dalam milidetik)
    var targetTime = new Date();
    targetTime.setHours(21, 0, 0, 0);

    function updateCountdown() {
      var currentTime = new Date().getTime();
      var timeLeft = targetTime - currentTime;

      if (timeLeft <= 0) {
        document.getElementById('timer').innerHTML = "Waktu sudah habis!";
        document.getElementById('content').style.display = 'block';
        clearInterval(countdownInterval); // Hentikan perbaruan countdown
      } else {
        var hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

        document.getElementById('timer').innerHTML = hours + " jam " + minutes + " menit " + seconds + " detik ";
      }
    }

    // Memperbarui countdown setiap detik
    var countdownInterval = setInterval(updateCountdown, 1000);

    // Panggil fungsi pertama kali saat halaman dimuat
    updateCountdown();
  </script>
</body>
</html>
