<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <!-- ============ META =============== -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Profile Mustofa Sagala</title>
    <meta name="robots" content="noindex">
    <!-- ============ FAVICON =============== -->
    <link rel="icon" href="assets/images/favicon/favicon.png">
    <!-- ============ GOOGLE FONT =============== -->
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:600,600i,700" rel="stylesheet">
    <!-- ============ CSS =============== -->
    <!-- Bootstrap -->
    <link href="https://jurnal.biz.id/assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://jurnal.biz.id/assets/fonts/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <!-- Flaticon -->
    <link href="https://jurnal.biz.id/assets/fonts/flaticon/flaticon.css" rel="stylesheet">
    <!-- Template Stylesheet -->
    <link href="https://jurnal.biz.id/assets/css/style.css" rel="stylesheet">
    <style>
      .ptb-60 {
        margin-top: 100px;
      }

      .page-wrapper {
        min-height: 90.2vh;
      }
      body{
      min-height:0;
      }
      .love-button {
  background: transparent;
  border: none;
  font-size: 24px;
  color: #000; /* Warna awal ikon hati */
  cursor: pointer;
  transition: color 0.3s; /* Animasi warna ikon */
}

.love-button.active {
  color: red; /* Warna ikon hati saat diklik */
}
    </style>
    
  </head>
  <body id="body" class="wide-layout preloader-active">
    <!-- ============ PRELOADER =============== -->
    <div id="preloader" class="preloader">
      <div class="loader fa fa-spin pos-center"></div>
    </div>
    <!-- ============ WRAPPER =============== -->
    <div id="pageWrapper" class="page-wrapper">
      <!-- ============ Content =============== -->
      
        
          <!-- Start Domains Area -->
          <section class="section domains-area ptb-60">
            <div class="container">
              <div class="row mb-40">
                <div class="col-lg-10 col-md-8 col-sm-10 col-xs-12 col-xs-center t-center">
                  <h2 class="mb-20 font-50 t-uppercase">إِنَّ مَعَ الْعُسْرِ يُسْرًا</h2>
                  <br>
                  <p class="color-mid">“Sesungguhnya, sesudah kesulitan itu ada kemudahan.” – (QS.94:6)</p>
                  <br>
                  <p class="color-mid">😊</p>
                  <br>
                  <p class="color-mid" style="text-align: center; font-size: 12px;"> © All right reserved | Made with ♥ by @mustofasagala </p>
                
                <button id="loveButton" class="love-button">
                  <i class="fa fa-heart"></i>
                </button>
                <span id="loveCount">0</span>
              </div>
              </div>
            </div>
          </section>
          <!-- End Domain Area -->
        
    
      <!-- ============ Footer =============== -->
    </div>
    <!-- ============ Javascript Libs =============== -->
    <!-- jQuery  -->
    <script src="https://jurnal.biz.id/assets/js/jquery-1.12.3.min.js"></script>
    <!-- Custom JavaScript  -->
    <script type="text/javascript" src="https://jurnal.biz.id/assets/js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const loveButton = document.getElementById("loveButton");
        const loveCountElement = document.getElementById("loveCount");
      
        // Fungsi untuk mengirim permintaan ke server dan menyimpan jumlah "Love" ke database
        function incrementLoveCount() {
          // Kirim permintaan AJAX ke server untuk meningkatkan jumlah "Love"
          // Di sini, kita hanya menambahkan 1 ke jumlah "Love" setiap kali tombol diklik.
          // Anda harus menggantinya dengan permintaan sebenarnya ke server dan mengupdate basis data.
          
          let currentCount = parseInt(loveCountElement.innerHTML);
          currentCount += 1;
          loveCountElement.innerHTML = currentCount;
      
          // Mengubah warna ikon hati menjadi merah (aktif)
          loveButton.classList.add("active");
        }
      
        // Tambahkan event listener ke tombol "Love"
        loveButton.addEventListener("click", incrementLoveCount);
      });
      </script>
      
  </body>
</html>
