<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Web Sederhana</title>
</head>
<body>
    <div id="content">
        <!-- Konten dari halaman web yang akan dimuat di sini -->
    </div>

    <script>
        // Fungsi untuk memuat konten dari halaman web yang memiliki sesi
        async function loadContent() {
            try {
                const response = await fetch('https://mustofa.sagala.my.id/about', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.text();

                // Memasukkan konten yang diperoleh ke dalam elemen dengan ID 'content'
                document.getElementById('content').innerHTML = data;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Memanggil fungsi loadContent() saat halaman dimuat
        window.onload = loadContent;
    </script>
</body>
</html>
