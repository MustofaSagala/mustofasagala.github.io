<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Pengambilan Konten</title>
</head>
<body>
    <div id="content">
        <!-- Konten dari halaman web yang akan dimuat di sini -->
    </div>

    <script>
        // Fungsi untuk melakukan permintaan ke halaman web yang memiliki sesi
        function fetchData() {
            fetch('https://mustofa.sagala.my.id/about', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => response.text())
            .then(data => {
                // Memasukkan konten yang diperoleh ke dalam elemen dengan ID 'content'
                document.getElementById('content').innerHTML = data;
            })
            .catch(error => console.error('Error:', error));
        }

        // Memanggil fungsi fetchData() saat halaman dimuat
        window.onload = fetchData;
    </script>
</body>
</html>
