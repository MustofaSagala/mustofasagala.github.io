<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contoh AJAX dan iFrame</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
    $.ajax({
        url: 'https://mustofa.sagala.my.id/about',
        type: 'GET',
        success: function(response) {
            // Jika sukses, isi iframe dengan konten dari respons AJAX
            $('#target_iframe').contents().find('html').html(response);
        },
        error: function(xhr, status, error) {
            // Jika terjadi kesalahan, tampilkan pesan kesalahan
            console.log('Error:', error);
        }
    });
});
</script>
</head>
<body>

<h2>Konten dari mustofa.sagala.my.id/about</h2>

<iframe id="target_iframe" width="100%" height="500px" frameborder="0"></iframe>

</body>
</html>
